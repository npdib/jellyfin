<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Password Strength Enforcement</title>
</head>
<body>
    <div id="PseConfigPage"
         data-role="page"
         class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button">

        <div data-role="content">
            <div class="content-primary">

                <h2 style="margin-top:0">Password Strength Enforcement</h2>

                <!-- ── Force Reset ──────────────────────────────────────── -->
                <div class="verticalSection">
                    <h3>Force Password Reset</h3>
                    <p style="color:#aaa;font-size:0.9em;line-height:1.6">
                        Immediately logs out <strong>all non-admin users</strong> and requires
                        them to set a new password meeting the strength policy on their next login.<br><br>
                        You must confirm your own password before this action takes effect.
                    </p>

                    <div class="inputContainer" style="max-width:320px">
                        <label class="inputLabel inputLabelUnfocused" for="PseAdminPassword">
                            Your Password (confirmation)
                        </label>
                        <input id="PseAdminPassword"
                               type="password"
                               is="emby-input"
                               autocomplete="current-password" />
                    </div>

                    <div id="PseResetError"
                         style="color:#ff6b6b;font-size:0.9em;margin:0.5em 0;display:none">
                    </div>
                    <div id="PseResetSuccess"
                         style="color:#4caf50;font-size:0.9em;margin:0.5em 0;display:none">
                    </div>

                    <button is="emby-button"
                            id="PseForceResetBtn"
                            class="raised emby-button"
                            type="button"
                            style="background:#c0392b;color:#fff;margin-top:0.5em"
                            onclick="pseForceReset()">
                        <span>Force Password Reset for All Users</span>
                    </button>
                </div>

            </div>
        </div>

        <script type="text/javascript">
            (function () {
                var PLUGIN_API = '/PasswordStrength';

                window.pseForceReset = function () {
                    var password = document.getElementById('PseAdminPassword').value;
                    var errorEl = document.getElementById('PseResetError');
                    var successEl = document.getElementById('PseResetSuccess');
                    var btn = document.getElementById('PseForceResetBtn');

                    errorEl.style.display = 'none';
                    successEl.style.display = 'none';

                    if (!password) {
                        errorEl.textContent = 'Please enter your password to confirm.';
                        errorEl.style.display = 'block';
                        return;
                    }

                    btn.disabled = true;

                    window.fetch(ApiClient.getUrl(PLUGIN_API + '/ForceReset'), {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'X-Emby-Token': ApiClient.accessToken(),
                        },
                        body: JSON.stringify({ adminPassword: password }),
                    })
                        .then(function (r) {
                            btn.disabled = false;
                            document.getElementById('PseAdminPassword').value = '';

                            if (r.status === 204) {
                                successEl.textContent = 'Done. All non-admin users have been logged out and will be required to set a new password.';
                                successEl.style.display = 'block';
                            } else {
                                return r.json().then(function (data) {
                                    errorEl.textContent = data.message || 'An error occurred.';
                                    errorEl.style.display = 'block';
                                });
                            }
                        })
                        .catch(function () {
                            btn.disabled = false;
                            errorEl.textContent = 'A network error occurred. Please try again.';
                            errorEl.style.display = 'block';
                        });
                };
            }());
        </script>

    </div>
</body>
</html>
