name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "9.0.x"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from commits since last tag
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" \
              | grep -v '\[skip ci\]' | head -20 > changelog.txt
          else
            echo "Initial release." > changelog.txt
          fi

      - name: Build (Release)
        run: >
          dotnet publish Jellyfin.Plugin.Template.csproj -c Release -o ./publish --nologo
          /p:Version=${{ steps.version.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.version.outputs.VERSION }}

      - name: Package zip
        run: |
          mkdir -p dist
          zip -j "dist/Jellyfin.Plugin.Template_${{ steps.version.outputs.VERSION }}.zip" \
              publish/Jellyfin.Plugin.Template.dll

      - name: Calculate MD5 checksum
        id: checksum
        run: |
          MD5=$(md5sum "dist/Jellyfin.Plugin.Template_${{ steps.version.outputs.VERSION }}.zip" \
                | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          echo "MD5=$MD5" >> "$GITHUB_OUTPUT"

      - name: Commit updated manifest.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHECKSUM="${{ steps.checksum.outputs.MD5 }}"
          ZIP="Jellyfin.Plugin.Template_${VERSION}.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${ZIP}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Prepend new version entry; remove any existing entry with the same version (idempotent).
          jq \
            --arg ver  "$VERSION" \
            --arg url  "$URL" \
            --arg sum  "$CHECKSUM" \
            --arg ts   "$TIMESTAMP" \
            --rawfile  cl changelog.txt \
            '.[0].versions = [
               {
                 "version":   $ver,
                 "changelog": ($cl | rtrimstr("\n")),
                 "targetAbi": "10.9.0.0",
                 "sourceUrl": $url,
                 "checksum":  $sum,
                 "timestamp": $ts
               }
             ] + (.[0].versions | map(select(.version != $ver)))' \
            manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json
          git add manifest.json
          git diff --staged --quiet || \
            git commit -m "chore: update manifest for v${VERSION} [skip ci]"
          git push origin main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: dist/Jellyfin.Plugin.Template_${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
